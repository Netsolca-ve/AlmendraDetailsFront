<nav [class.scrolled]="isScrolled()" [class.transparent]="isTransparent()">
    <a class="logo" routerLink="/" aria-label="Almendra Details, ir al inicio">
        <span class="logoMark" aria-hidden="true"></span>
    </a>

    <div class="links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
        <a routerLink="/catalog" routerLinkActive="active">Catálogo</a>
        <a routerLink="/about-us" routerLinkActive="active">Sobre Nosotros</a>
            <a routerLink="/contact" routerLinkActive="active">Contacto</a>
    </div>

    <div class="mobile">
        <div class="links" [class.open]="isMobileOpen()" (click)="isMobileOpen.set(false)">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
            <a routerLink="/catalog" routerLinkActive="active">Catálogo</a>
            <a routerLink="/about-us" routerLinkActive="active">Sobre Nosotros</a>
            <a routerLink="/contact" routerLinkActive="active">Contacto</a>

            <a class="contact-btn" [href]="contact.whatsapp" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
                Escríbenos
            </a>
        </div>

        <mat-icon (click)="isOpen.set(true)" class="material-icons-outlined cart-icon">shopping_cart</mat-icon>
        <button type="button" class="menu-btm"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMobileOpen()"
        aria-label="Abrir menu"
        >
        <mat-icon class="material-icons-outlined" >
            {{ isMobileOpen() ? 'close' : 'menu'  }}
        </mat-icon>
        </button>
    </div>

    <div class="btns">
        <mat-icon (click)="isOpen.set(true)" class="material-icons-outlined cart-icon">shopping_cart</mat-icon>
     
        <a class="contact-btn" [href]="contact.whatsapp" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
                Escríbenos
            </a>
    </div>
</nav>

<app-shopping-cart 
  [isOpen]="isOpen()" 
  (closeCart)="isOpen.set(false)">
</app-shopping-cart>
